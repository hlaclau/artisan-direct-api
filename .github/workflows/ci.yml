name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            task: lint
          - name: Format
            task: fmt:check
          - name: Typecheck
            task: typecheck
          - name: Test
            task: test
          - name: Build
            task: build
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: mise run ${{ matrix.task }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - name: Run tests with coverage
        run: mise run test:coverage
      - name: Publish coverage report
        if: always()
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        # fork PRs get a read-only token and cannot comment
        continue-on-error: true
        with:
          threshold-icons: "{0: '🔴', 50: '🟠', 70: '🟡', 80: '🟢'}"
          name: 'Coverage Report · 🔴 under 50% · 🟠 50-69% · 🟡 70-79% · 🟢 80%+'
